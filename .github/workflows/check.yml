name: MoonBit checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain version
        run: moon version --all
      - name: Check
        run: moon check --deny-warn --target all
      - name: Build
        run: moon build --target all
      - name: Test
        run: moon test --deny-warn --target all
      - name: Run the demo
        run: moon run examples/demo
      - name: Check formatting and interface
        # `moon fmt` output follows the installed toolchain release, so this step
        # compares against the same toolchain CI just installed.
        run: |
          moon fmt
          moon info
          git diff --exit-code
